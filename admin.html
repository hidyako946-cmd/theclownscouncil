<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Clown's Council — Панель управления</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #ff4500;
      --accent-hover: #ff6347;
      --text-main: #e1e1e6;
      --text-muted: #a8a8b3;
      --border-color: #323238;
      --green: #00b37e;
      --red: #ff4d4d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 650px; margin: 0 auto; }
    h1 { font-size: 1.5rem; color: #fff; text-align: center; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; margin-top: 12px; }
    input, select, textarea {
      width: 100%;
      background: #121214;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: var(--border-color); cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border: 1px dashed var(--border-color);
      color: var(--text-main);
      font-size: 0.9rem;
      padding: 8px 14px;
      margin-top: 10px;
    }
    .btn-secondary:hover { border-color: var(--accent-color); color: var(--accent-color); }
    
    .player-row {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      position: relative;
    }
    .player-row-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .remove-row-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      color: var(--red);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0;
      width: auto;
      margin: 0;
    }

    .success { color: var(--green); text-align: center; font-weight: bold; margin-top: 10px; display: none; }
    .error-msg { color: var(--red); text-align: center; font-size: 0.85rem; margin-top: 10px; display: none; }
    .auth-box { text-align: center; padding: 40px 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎪 Панель организатора</h1>

    <!-- Авторизация -->
    <div id="auth-section" class="card auth-box">
      <h3>🔐 Авторизация</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Введите ваш Personal Access Token от GitHub:</p>
      <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
      <button onclick="saveToken()">Войти</button>
    </div>

    <!-- Основная админка -->
    <div id="admin-section" style="display: none;">
      
      <!-- Добавление игрока в базу -->
      <div class="card">
        <h3>👥 Добавить нового участника в базу</h3>
        <label>Имя / Никнейм</label>
        <input type="text" id="player-name" placeholder="Например: Андрей">
        <label>Любимый генерал / Заметки</label>
        <input type="text" id="player-cmd" placeholder="Например: Lumra">
        <button id="btn-player" onclick="createPlayer()">Сохранить участника</button>
        <div id="player-success" class="success">Участник успешно добавлен! 🎉</div>
        <div id="player-error" class="error-msg"></div>
      </div>

      <!-- Создание отчета -->
      <div class="card">
        <h3>🏆 Опубликовать отчёт о турнире</h3>
        <label>Название турнира</label>
        <input type="text" id="event-title" value="EDH Встреча">
        
        <div style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label>Дата проведения</label>
            <input type="date" id="event-date">
          </div>
          <div style="flex: 1;">
            <label>Всего участников</label>
            <input type="number" id="event-count" value="12">
          </div>
        </div>

        <label>Формат / Брекет</label>
        <input type="text" id="event-format" value="Commander / Bracket 3">

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0 10px;">
        <h4 style="margin: 0; color: #fff;">📊 Результаты участников</h4>
        <div id="results-container"></div>
        <button type="button" class="btn-secondary" onclick="addResultRow()">+ Добавить участника в таблицу</button>

        <label style="margin-top: 20px;">Заметки / Описание турнира</label>
        <textarea id="event-body" rows="3" placeholder="Заметки по метагейму, ключевым партиям..."></textarea>

        <button id="btn-event" onclick="createEvent()">Опубликовать отчёт на сайте</button>
        <div id="event-success" class="success">Отчёт успешно опубликован! 🚀</div>
        <div id="event-error" class="error-msg"></div>
      </div>

      <div style="text-align: center;">
        <button onclick="logout()" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); width: auto; padding: 6px 14px; font-size: 0.8rem;">Выйти</button>
      </div>

    </div>
  </div>

  <script>
    const REPO = 'hidyako946-cmd/theclownscouncil';

    function getToken() { return localStorage.getItem('github_token'); }

    function saveToken() {
      const token = document.getElementById('token-input').value.trim();
      if (!token) return alert('Введите токен!');
      localStorage.setItem('github_token', token);
      checkAuth();
    }

    function logout() {
      localStorage.removeItem('github_token');
      checkAuth();
    }

    function checkAuth() {
      if (getToken()) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('admin-section').style.display = 'block';
        document.getElementById('event-date').valueAsDate = new Date();
        if (document.getElementById('results-container').children.length === 0) {
          addResultRow('🥇 1 место');
          addResultRow('🥈 2 место');
        }
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('admin-section').style.display = 'none';
      }
    }

    function addResultRow(defaultPlace = 'Участник') {
      const container = document.getElementById('results-container');
      const rowId = 'row-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
      
      const row = document.createElement('div');
      row.className = 'player-row';
      row.id = rowId;
      row.innerHTML = `
        <button type="button" class="remove-row-btn" onclick="document.getElementById('${rowId}').remove()">✕</button>
        <div class="player-row-grid">
          <div>
            <label style="margin-top:0;">Место / Награда</label>
            <select class="res-place">
              <option value="🥇 1 место" ${defaultPlace === '🥇 1 место' ? 'selected' : ''}>🥇 1 место</option>
              <option value="🥈 2 место" ${defaultPlace === '🥈 2 место' ? 'selected' : ''}>🥈 2 место</option>
              <option value="🥉 3 место" ${defaultPlace === '🥉 3 место' ? 'selected' : ''}>🥉 3 место</option>
              <option value="4 место / Финалист" ${defaultPlace === '4 место / Финалист' ? 'selected' : ''}>4 место / Финалист</option>
              <option value="Участник" ${defaultPlace === 'Участник' ? 'selected' : ''}>Участник</option>
            </select>
          </div>
          <div>
            <label style="margin-top:0;">Имя игрока</label>
            <input type="text" class="res-name" placeholder="Имя / Никнейм">
          </div>
        </div>
        <div class="player-row-grid" style="margin-top: 6px;">
          <div>
            <label style="margin-top:0;">Командир / Колода</label>
            <input type="text" class="res-commander" placeholder="Напр: Lumra">
          </div>
          <div>
            <label style="margin-top:0;">Ссылка на Moxfield</label>
            <input type="text" class="res-mox" placeholder="https://moxfield.com/...">
          </div>
        </div>
      `;
      container.appendChild(row);
    }

    function slugify(text) {
      const ru = {
        'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh',
        'з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o',
        'п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts',
        'ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'
      };
      return text.toLowerCase().split('').map(char => ru[char] || char).join('')
        .replace(/[^a-z0-9]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'vstrecha';
    }

    async function commitToGitHub(path, content, message) {
      const token = getToken();
      const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
      
      let sha = null;
      try {
        const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }
      } catch (e) {}

      const bodyData = {
        message: message,
        content: btoa(unescape(encodeURIComponent(content)))
      };
      if (sha) bodyData.sha = sha;

      const putRes = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(bodyData)
      });

      if (!putRes.ok) {
        const err = await putRes.json();
        throw new Error(err.message || 'Ошибка сохранения файла на GitHub');
      }
    }

    async function createPlayer() {
      const btn = document.getElementById('btn-player');
      const errBox = document.getElementById('player-error');
      const name = document.getElementById('player-name').value.trim();
      const cmd = document.getElementById('player-cmd').value.trim();
      
      errBox.style.display = 'none';
      if (!name) return alert('Введите имя игрока!');

      btn.disabled = true;
      btn.innerText = 'Сохранение... ⏳';

      const slug = slugify(name);
      const content = `---\nname: "${name}"\nfavorite_commander: "${cmd}"\n---\n`;

      try {
        await commitToGitHub(`content/players/${slug}.md`, content, `Add player ${name}`);
        document.getElementById('player-success').style.display = 'block';
        document.getElementById('player-name').value = '';
        document.getElementById('player-cmd').value = '';
        setTimeout(() => document.getElementById('player-success').style.display = 'none', 4000);
      } catch (e) {
        errBox.innerText = 'Ошибка: ' + e.message;
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Сохранить участника';
      }
    }

    async function createEvent() {
      const btn = document.getElementById('btn-event');
      const errBox = document.getElementById('event-error');
      const title = document.getElementById('event-title').value.trim() || "EDH Встреча";
      const date = document.getElementById('event-date').value;
      const format = document.getElementById('event-format').value.trim() || "Commander / Bracket 3";
      const count = document.getElementById('event-count').value || 12;
      const bodyText = document.getElementById('event-body').value.trim();

      errBox.style.display = 'none';
      if (!date) return alert('Выберите дату проведения!');

      btn.disabled = true;
      btn.innerText = 'Публикация... ⏳';

      // Собираем результаты всех участников из формы
      const rows = document.querySelectorAll('#results-container .player-row');
      let resultsYaml = '';
      
      if (rows.length > 0) {
        resultsYaml = 'results:\n';
        rows.forEach(row => {
          const place = row.querySelector('.res-place').value;
          const pName = row.querySelector('.res-name').value.trim();
          const commander = row.querySelector('.res-commander').value.trim();
          const mox = row.querySelector('.res-mox').value.trim();

          if (pName) {
            resultsYaml += `  - place: "${place}"\n    player_name: "${pName}"\n`;
            if (commander) resultsYaml += `    commander: "${commander}"\n`;
            if (mox) resultsYaml += `    moxfield_url: "${mox}"\n`;
          }
        });
      }

      const slug = slugify(title);
      const filename = `content/events/${date}-${slug}.md`;

      const content = `---\ntitle: "${title}"\ndate: "${date}"\nformat: "${format}"\nplayers_count: ${count}\n${resultsYaml}---\n${bodyText}\n`;

      try {
        await commitToGitHub(filename, content, `Add tournament report ${date}`);
        document.getElementById('event-success').style.display = 'block';
        document.getElementById('event-body').value = '';
        setTimeout(() => document.getElementById('event-success').style.display = 'none', 4000);
      } catch (e) {
        errBox.innerText = 'Ошибка публикации: ' + e.message;
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Опубликовать отчёт на сайте';
      }
    }

    checkAuth();
  </script>
</body>
</html>
