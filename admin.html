<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Clown's Council — Панель управления</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #ff4500;
      --accent-hover: #ff6347;
      --text-main: #e1e1e6;
      --text-muted: #a8a8b3;
      --border-color: #323238;
      --green: #00b37e;
      --red: #ff4d4d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    .admin-header h1 { font-size: 1.4rem; color: #fff; margin: 0; }
    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      background: var(--card-bg);
    }
    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; margin-top: 12px; }
    .req { color: var(--red); font-weight: bold; }
    input, select, textarea {
      width: 100%;
      background: #121214;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
    button:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px dashed var(--border-color);
      color: var(--text-main);
      font-size: 0.9rem;
      padding: 8px 14px;
      margin-top: 10px;
    }
    .player-row {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      position: relative;
    }
    .player-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .remove-row-btn {
      position: absolute; top: 6px; right: 8px;
      background: none; border: none; color: var(--red);
      font-size: 1.1rem; cursor: pointer; padding: 0; width: auto; margin: 0;
    }
    .auth-box { text-align: center; padding: 40px 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="admin-header">
      <h1>🎪 Панель организатора</h1>
      <a href="index.html" class="back-btn">← На сайт отчётов</a>
    </div>

    <div id="auth-section" class="card auth-box">
      <h3>🔐 Авторизация</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Введите ваш Personal Access Token от GitHub:</p>
      <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
      <button type="button" onclick="saveToken()">Войти</button>
    </div>

    <div id="admin-section" style="display: none;">
      <div class="admin-tabs">
        <button type="button" class="tab-btn active" onclick="switchAdminTab('tab-events', event)">🏆 Прошедшие турниры</button>
        <button type="button" class="tab-btn" onclick="switchAdminTab('tab-players', event)">👥 Участники</button>
      </div>

      <div id="tab-events" class="tab-content active">
        <div class="card">
          <h3 id="event-form-title">🏆 Опубликовать отчёт о турнире</h3>
          <input type="hidden" id="event-file-name" value="">

          <label>Автор отчёта (Организатор) <span class="req">*</span></label>
          <input type="text" id="event-author" value="Андрей">

          <label>Название турнира <span class="req">*</span></label>
          <input type="text" id="event-title" value="EDH Встреча">
          
          <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
              <label>Дата проведения <span class="req">*</span></label>
              <input type="date" id="event-date">
            </div>
            <div style="flex: 1;">
              <label>Всего участников</label>
              <input type="number" id="event-count" value="12">
            </div>
          </div>

          <label>Формат / Брекет</label>
          <input type="text" id="event-format" value="Commander / Bracket 3">

          <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0 10px;">
          <h4 style="margin: 0; color: #fff;">📊 Результаты участников</h4>
          <div id="results-container"></div>
          <button type="button" class="btn-secondary" onclick="addResultRow()">+ Добавить участника в таблицу</button>

          <label style="margin-top: 20px;">Заметки / Описание турнира</label>
          <textarea id="event-body" rows="3" placeholder="Заметки по метагейму, ключевым партиям..."></textarea>

          <button id="btn-event" type="button" onclick="createEvent()">Опубликовать отчёт на сайте</button>
        </div>
      </div>

      <div id="tab-players" class="tab-content">
        <div class="card">
          <h3>➕ Добавить нового участника</h3>
          <input type="hidden" id="player-file-slug" value="">
          <label>Имя / Никнейм <span class="req">*</span></label>
          <input type="text" id="player-name" placeholder="Например: Андрей">
          <label>Любимый генерал / Заметки</label>
          <input type="text" id="player-cmd" placeholder="Например: Lumra">
          <button type="button" onclick="savePlayer()">Сохранить участника</button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 30px;">
        <button type="button" onclick="logout()" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); width: auto; padding: 6px 14px; font-size: 0.8rem;">Сбросить токен / Выйти</button>
      </div>
    </div>
  </div>

  <script>
    const REPO = 'hidyako946-cmd/theclownscouncil';

    function getToken() { return localStorage.getItem('github_token'); }

    function saveToken() {
      const token = document.getElementById('token-input').value.trim();
      if (!token) return alert('Введите токен!');
      localStorage.setItem('github_token', token);
      checkAuth();
    }

    function logout() {
      localStorage.removeItem('github_token');
      checkAuth();
    }

    function switchAdminTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (evt && evt.target) evt.target.classList.add('active');
    }

    function checkAuth() {
      if (getToken()) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('admin-section').style.display = 'block';
        if (!document.getElementById('event-date').value) {
          document.getElementById('event-date').value = new Date().toISOString().split('T')[0];
        }
        if (document.getElementById('results-container').children.length === 0) {
          addResultRow('🥇 1 место');
          addResultRow('🥈 2 место');
        }
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('admin-section').style.display = 'none';
      }
    }

    function slugify(text) {
      const ru = {
        'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh',
        'з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o',
        'п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts',
        'ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'
      };
      return text.toLowerCase().split('').map(char => ru[char] || char).join('')
        .replace(/[^a-z0-9]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'vstrecha';
    }

    // Безопасное кодирование UTF-8 в Base64 для корректного сохранения эмодзи и кириллицы
    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    async function commitToGitHub(path, content, message) {
      const token = getToken();
      if (!token) throw new Error('Отсутствует токен авторизации');

      const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
      
      let sha = null;
      try {
        const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }
      } catch (e) {}

      const bodyData = {
        message: message,
        content: utf8ToBase64(content)
      };
      if (sha) bodyData.sha = sha;

      const putRes = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(bodyData)
      });

      if (!putRes.ok) {
        const err = await putRes.json();
        throw new Error(`GitHub API (${putRes.status}): ${err.message || 'Ошибка сохранения'}`);
      }
    }

    function addResultRow(defaultPlace = 'Участник', defaultName = '', defaultCmd = '', defaultMox = '') {
      const container = document.getElementById('results-container');
      const rowId = 'row-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

      const row = document.createElement('div');
      row.className = 'player-row';
      row.id = rowId;
      row.innerHTML = `
        <button type="button" class="remove-row-btn" onclick="document.getElementById('${rowId}').remove()">✕</button>
        <div class="player-row-grid">
          <div>
            <label style="margin-top:0;">Место / Награда</label>
            <select class="res-place">
              <option value="🥇 1 место" ${defaultPlace === '🥇 1 место' ? 'selected' : ''}>🥇 1 место</option>
              <option value="🥈 2 место" ${defaultPlace === '🥈 2 место' ? 'selected' : ''}>🥈 2 место</option>
              <option value="🥉 3 место" ${defaultPlace === '🥉 3 место' ? 'selected' : ''}>🥉 3 место</option>
              <option value="4 место / Финалист" ${defaultPlace === '4 место / Финалист' ? 'selected' : ''}>4 место / Финалист</option>
              <option value="Участник" ${defaultPlace === 'Участник' ? 'selected' : ''}>Участник</option>
            </select>
          </div>
          <div>
            <label style="margin-top:0;">Имя игрока</label>
            <input type="text" class="res-name" value="${defaultName}" placeholder="Имя / Никнейм">
          </div>
        </div>
        <div class="player-row-grid" style="margin-top: 6px;">
          <div>
            <label style="margin-top:0;">Командир / Колода</label>
            <input type="text" class="res-commander" value="${defaultCmd}" placeholder="Напр: Lumra">
          </div>
          <div>
            <label style="margin-top:0;">Ссылка на Moxfield</label>
            <input type="text" class="res-mox" value="${defaultMox}" placeholder="https://moxfield.com/...">
          </div>
        </div>
      `;
      container.appendChild(row);
    }

    async function savePlayer() {
      const name = document.getElementById('player-name').value.trim();
      const cmd = document.getElementById('player-cmd').value.trim();
      if (!name) return alert('Введите имя участника!');

      const slug = slugify(name);
      const content = `---\nname: "${name}"\nfavorite_commander: "${cmd}"\n---\n`;

      try {
        await commitToGitHub(`content/players/${slug}.md`, content, `Add player ${name}`);
        alert('🎉 Участник успешно сохранён на GitHub!');
        document.getElementById('player-name').value = '';
        document.getElementById('player-cmd').value = '';
      } catch (e) {
        alert(' Ошибка сохранения участника: ' + e.message);
      }
    }

    async function createEvent() {
      const btn = document.getElementById('btn-event');
      const author = document.getElementById('event-author').value.trim();
      const title = document.getElementById('event-title').value.trim();
      const date = document.getElementById('event-date').value;
      const format = document.getElementById('event-format').value.trim() || "Commander / Bracket 3";
      const count = document.getElementById('event-count').value || 12;
      const bodyText = document.getElementById('event-body').value.trim();

      if (!title || !date || !author) {
        alert(' Заполните обязательные поля: Автор, Название и Дата!');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Публикация... ⏳';

      const rows = document.querySelectorAll('#results-container .player-row');
      let resultsBlock = '';
      let hasResults = false;

      rows.forEach(row => {
        const place = row.querySelector('.res-place').value;
        const pName = row.querySelector('.res-name').value.trim();
        const commander = row.querySelector('.res-commander').value.trim();
        const mox = row.querySelector('.res-mox').value.trim();

        if (pName) {
          if (!hasResults) {
            resultsBlock = 'results:\n';
            hasResults = true;
          }
          resultsBlock += `  - place: "${place}"\n    player_name: "${pName}"\n`;
          if (commander) resultsBlock += `    commander: "${commander}"\n`;
          if (mox) resultsBlock += `    moxfield_url: "${mox}"\n`;
        }
      });

      const slug = slugify(title);
      const filename = `content/events/${date}-${slug}.md`;

      const content = `---\ntitle: "${title}"\ndate: "${date}"\nauthor: "${author}"\nformat: "${format}"\nplayers_count: ${count}\n${resultsBlock}---\n${bodyText}\n`;

      try {
        await commitToGitHub(filename, content, `Add tournament report ${date}`);
        alert('🎉 Отчёт успешно сохранён на GitHub в папку content/events/!');
        document.getElementById('event-body').value = '';
      } catch (e) {
        alert(' Ошибка публикации отчёта: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Опубликовать отчёт на сайте';
      }
    }

    checkAuth();
  </script>
</body>
</html>
