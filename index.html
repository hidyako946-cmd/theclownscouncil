<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Clown's Council — EDH Reports</title>
  <!-- Подключаем обработчик Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #ff4500;
      --accent-hover: #ff6347;
      --text-main: #e1e1e6;
      --text-muted: #a8a8b3;
      --border-color: #323238;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      text-align: center;
      padding: 30px 0 15px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 25px;
    }
    h1 { margin: 0; font-size: 1.8rem; color: #fff; }
    p.subtitle { color: var(--text-muted); margin-top: 6px; font-size: 0.95rem; }
    .admin-link {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px dashed var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
    }
    .admin-link:hover { color: var(--accent-hover); border-color: var(--accent-color); }
    
    .event-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .event-card h2 { margin-top: 0; color: #fff; font-size: 1.4rem; }
    .event-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    .results-list {
      list-style: none;
      padding: 0;
      margin: 15px 0;
    }
    .results-list li {
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-color);
    }
    .results-list li:last-child { border-bottom: none; }
    .moxfield-link {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 8px;
    }
    .moxfield-link:hover { text-decoration: underline; }
    .empty-state, .loading-state {
      text-align: center;
      background-color: var(--card-bg);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 40px 20px;
      margin-bottom: 30px;
    }
    footer {
      text-align: center;
      color: var(--text-muted);
      margin-top: 40px;
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎪 The Clown's Council</h1>
      <p class="subtitle">Отчёты о турнирах EDH Commander, метагейм и сводки колод</p>
      <a href="https://theclownscouncil.netlify.app/admin/" class="admin-link">⚙️ Панель организатора</a>
    </header>

    <main id="reports-list">
      <div class="loading-state">
        <h2>Загрузка отчётов... 🎲</h2>
      </div>
    </main>

    <footer>
      <p>© The Clown's Council</p>
    </footer>
  </div>

  <script>
    const GITHUB_USERNAME = 'hidyako946-cmd';
    const REPO_NAME = 'theclownscouncil';

    function parseFrontmatter(text) {
      const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (!match) return { data: {}, body: text };
      
      const rawYaml = match[1];
      const body = match[2];
      const data = {};

      let currentListKey = null;
      let currentListItem = null;

      rawYaml.split('\n').forEach(line => {
        if (!line.trim()) return;
        
        const keyVal = line.match(/^([a-zA-Z0-9_]+):\s*(.*)$/);
        if (keyVal && !line.startsWith('  ')) {
          const key = keyVal[1];
          let val = keyVal[2].trim().replace(/^["']|["']$/g, '');
          currentListKey = null;
          
          if (val === '') {
            data[key] = [];
            currentListKey = key;
          } else {
            data[key] = val;
          }
          return;
        }

        if (currentListKey && line.trim().startsWith('- ')) {
          currentListItem = {};
          data[currentListKey].push(currentListItem);
          const itemKeyVal = line.trim().substring(2).match(/^([a-zA-Z0-9_]+):\s*(.*)$/);
          if (itemKeyVal) {
            currentListItem[itemKeyVal[1]] = itemKeyVal[2].trim().replace(/^["']|["']$/g, '');
          }
          return;
        }

        if (currentListItem && line.startsWith('    ')) {
          const itemKeyVal = line.trim().match(/^([a-zA-Z0-9_]+):\s*(.*)$/);
          if (itemKeyVal) {
            currentListItem[itemKeyVal[1]] = itemKeyVal[2].trim().replace(/^["']|["']$/g, '');
          }
        }
      });

      return { data, body };
    }

    async function loadReports() {
      const container = document.getElementById('reports-list');
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/content/events`);
        
        if (!response.ok) {
          container.innerHTML = `
            <div class="empty-state">
              <h2>Турниров пока не зафиксировано 🎲</h2>
              <p>Отчёты появятся сразу после добавления первого мероприятия через панель организатора.</p>
            </div>`;
          return;
        }

        const files = await response.json();
        
        if (!Array.isArray(files)) {
          throw new Error('Not an array');
        }

        const mdFiles = files.filter(file => file.name && file.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <h2>Турниров пока не зафиксировано 🎲</h2>
              <p>Отчёты появятся сразу после добавления первого мероприятия через панель организатора.</p>
            </div>`;
          return;
        }

        container.innerHTML = '';

        for (const file of mdFiles.reverse()) {
          const fileRes = await fetch(file.download_url);
          if (!fileRes.ok) continue;
          const fileText = await fileRes.text();
          const { data, body } = parseFrontmatter(fileText);

          const card = document.createElement('article');
          card.className = 'event-card';

          let resultsHtml = '';
          if (data.results && Array.isArray(data.results)) {
            resultsHtml = '<ul class="results-list">' + data.results.map(r => `
              <li>
                <strong>${r.place || ''}:</strong> ${r.player_name || 'Игрок'}
                ${r.moxfield_url ? `<a href="${r.moxfield_url}" target="_blank" class="moxfield-link">📋 Колода на Moxfield</a>` : ''}
              </li>
            `).join('') + '</ul>';
          }

          card.innerHTML = `
            <h2>${data.title || 'EDH Встреча'}</h2>
            <div class="event-meta">
              📅 ${data.date ? data.date.split('T')[0] : ''} | 
              🏆 ${data.format || 'Commander'} | 
              👥 Участников: ${data.players_count || '-'}
            </div>
            ${resultsHtml}
            ${body.trim() ? `<div class="event-body">${marked.parse(body)}</div>` : ''}
          `;

          container.appendChild(card);
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="empty-state">
            <h2>Турниров пока не зафиксировано 🎲</h2>
            <p>Отчёты появятся сразу после добавления первого мероприятия через панель организатора.</p>
          </div>`;
      }
    }

    loadReports();

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "https://theclownscouncil.netlify.app/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
