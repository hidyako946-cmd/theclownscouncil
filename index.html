<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Clown's Council — EDH Reports</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #ff4500;
      --accent-hover: #ff6347;
      --text-main: #e1e1e6;
      --text-muted: #a8a8b3;
      --border-color: #323238;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      text-align: center;
      padding: 30px 0 15px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 25px;
    }
    h1 { margin: 0; font-size: 1.8rem; color: #fff; }
    p.subtitle { color: var(--text-muted); margin-top: 6px; font-size: 0.95rem; }
    .admin-link {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px dashed var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
    }
    .admin-link:hover { color: var(--accent-hover); border-color: var(--accent-color); }
    .empty-state {
      text-align: center;
      background-color: var(--card-bg);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 40px 20px;
      margin-bottom: 30px;
    }
    footer {
      text-align: center;
      color: var(--text-muted);
      margin-top: 40px;
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎪 The Clown's Council</h1>
      <p class="subtitle">Отчёты о турнирах EDH Commander, метагейм и сводки колод</p>
      <!-- Ссылка ведет на постоянный адрес админки Netlify -->
      <a href="https://theclownscouncil.netlify.app/admin/" class="admin-link">⚙️ Панель организатора</a>
    </header>
    <main id="reports-list">
      <div class="empty-state">
        <h2>Турниров пока не зафиксировано 🎲</h2>
        <p>Отчёты появятся сразу после добавления первого мероприятия через панель организатора.</p>
      </div>
    </main>
    <footer>
      <p>© The Clown's Council</p>
    </footer>
  </div>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "https://theclownscouncil.netlify.app/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
