backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # 1. Коллекция для быстрого управления списком участников
  - name: "players"
    label: "👥 Участники лиги"
    label_singular: "Участник"
    folder: "content/players"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.name}}"
    fields:
      - { label: "Имя игрока / Никнейм", name: "name", widget: "string" }
      - { label: "Любимый генерал / Заметки", name: "favorite_commander", widget: "string", required: false, hint: "Например: Lumra, 20000th Leaf" }

  # 2. Коллекция отчётов с динамической связкой игроков
  - name: "events"
    label: "🏆 Мероприятия и Отчёты"
    label_singular: "Отчёт"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Название турнира", name: "title", widget: "string", default: "EDH Встреча" }
      - { label: "Дата проведения", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Формат и Брекет", name: "format", widget: "string", default: "Commander / Bracket 3" }
      - { label: "Количество участников", name: "players_count", widget: "number", default: 12 }
      - { label: "Заметки по метагейму и хайлайты", name: "body", widget: "markdown", required: false }
      - label: "Результаты участников"
        name: "results"
        widget: "list"
        summary: '{{fields.place}}: {{fields.player_name}}'
        fields:
          - label: "Место / Награда"
            name: "place"
            widget: "select"
            default: "🥇 1 место"
            options:
              - "🥇 1 место"
              - "🥈 2 место"
              - "🥉 3 место"
              - "4 место / Финалист"
              - "Участник"
          - label: "Имя игрока"
            name: "player_name"
            widget: "relation"
            collection: "players"
            search_fields: ["name"]
            value_field: "name"
            display_fields: ["name"]
            hint: "Выберите игрока из базы"
          - { label: "Ссылка на Moxfield", name: "moxfield_url", widget: "string", required: false, hint: "https://www.moxfield.com/decks/..." }
