backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "events"
    label: "Мероприятия и Отчёты"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Название турнира", name: "title", widget: "string", default: "EDH Встреча" }
      - { label: "Дата проведения", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Формат и Брекет", name: "format", widget: "string", default: "Commander / Bracket 3" }
      - { label: "Количество участников", name: "players_count", widget: "number", default: 12 }
      - { label: "Заметки по метагейму и хайлайты", name: "body", widget: "markdown", required: false }
      - label: "Результаты участников"
        name: "results"
        widget: "list"
        summary: '{{fields.place}}: {{fields.player_name}}'
        fields:
          - label: "Место / Награда"
            name: "place"
            widget: "select"
            default: "🥇 1 место"
            options:
              - "🥇 1 место"
              - "🥈 2 место"
              - "🥉 3 место"
              - "4 место / Финалист"
              - "Участник"
          - label: "Имя игрока"
            name: "player_name"
            widget: "select"
            hint: "Выберите из списка или введите имя нового игрока"
            options:
              - "Андрей"
              - "Екатерина"
              - "Влад"
              - "Артем"
              - "Камиль"
              - "Настя"
          - { label: "Ссылка на Moxfield", name: "moxfield_url", widget: "string", required: false, hint: "https://www.moxfield.com/decks/..." }
